<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>گالری منوهای دیجیتال</title>
    <meta
      name="description"
      content="مجموعه تمپلیت‌های منوی دیجیتال رستوران، کافه و فودکورت — همه در یک نگاه"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="hero">
      <p class="brand">MenuTemplate</p>
      <h1>گالری منوهای دیجیتال</h1>
      <p class="lede">
        هر تمپلیت را باز کنید، ببینید و برای دیپلوی جداگانه روی Vercel بردارید.
      </p>
    </header>

    <main>
      <section class="grid" id="grid" aria-label="فهرست تمپلیت‌ها"></section>
    </main>

    <footer class="footer">
      <p>هر پوشهٔ پروژه به‌صورت مستقل هم قابل بیلد و دیپلوی است.</p>
    </footer>

    <script src="./projects.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
